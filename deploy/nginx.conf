# /etc/nginx/sites-available/flashcrowd  (symlinked into sites-enabled)
limit_req_zone $binary_remote_addr zone=fcapi:10m rate=20r/s;

server {
    listen 80 default_server;
    listen 443 ssl default_server;     # https://18-132-176-215.sslip.io (Let's Encrypt; browsers need HTTPS for the mic)
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/18-132-176-215.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/18-132-176-215.sslip.io/privkey.pem;

    root /var/www/flashcrowd;          # built frontend goes here at the final merge
    index index.html;
    location / { try_files $uri $uri/ /index.html; }

    # FLASHCROWD ARCADE (game build of the frontend)
    # the arcade + story page use the microphone (voice agent), which browsers only allow over HTTPS
    location = /story { return 302 https://18-132-176-215.sslip.io/arcade/story.html; }
    location /arcade/ {
        if ($scheme = http) { return 301 https://18-132-176-215.sslip.io$request_uri; }
        alias /var/www/arcade/;
        try_files $uri $uri/ /arcade/index.html;
    }

    # generated ElevenLabs audio (sound effects, commentator, alerts, music), cached on disk
    location /audio/ {
        alias /var/www/fc-audio/;
        add_header Cache-Control "public, max-age=3600";
    }

    location /api/ {
        limit_req zone=fcapi burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;       # WebSocket
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
}
